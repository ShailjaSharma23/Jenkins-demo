<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="container">
    <section class="hero">
        <p class="eyebrow">Student Portal</p>
        <h1>Student Registration Form</h1>
        <p class="intro">Capture basic student details and keep a clean record for classroom or lab use.</p>
    </section>

    <form id="student-form" class="student-form">
        <div class="field-grid">
            <label>
                Full Name
                <input type="text" name="fullName" placeholder="Enter full name" required>
            </label>

            <label>
                Roll Number
                <input type="text" name="rollNumber" placeholder="Enter roll number" required>
            </label>

            <label>
                Email Address
                <input type="email" name="email" placeholder="Enter email address" required>
            </label>

            <label>
                Phone Number
                <input type="tel" name="phone" placeholder="Enter phone number" required>
            </label>

            <label>
                Course
                <select name="course" required>
                    <option value="">Select course</option>
                    <option value="BCA">BCA</option>
                    <option value="BSc Computer Science">BSc Computer Science</option>
                    <option value="BCom">BCom</option>
                    <option value="BA">BA</option>
                </select>
            </label>

            <label>
                Gender
                <select name="gender" required>
                    <option value="">Select gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </label>

            <label>
                Date of Birth
                <input type="date" name="dob" required>
            </label>

            <label>
                Year of Study
                <select name="year" required>
                    <option value="">Select year</option>
                    <option value="First Year">First Year</option>
                    <option value="Second Year">Second Year</option>
                    <option value="Third Year">Third Year</option>
                    <option value="Final Year">Final Year</option>
                </select>
            </label>
        </div>

        <label class="full-width">
            Address
            <textarea name="address" rows="4" placeholder="Enter full address" required></textarea>
        </label>

        <div class="actions">
            <button type="submit">Submit Student Data</button>
            <button type="reset" class="secondary">Clear Form</button>
        </div>
    </form>

    <p id="status" class="status" aria-live="polite"></p>
</main>

<script src="script.js"></script>
</body>
</html>
