<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="tab-list" role="tablist" aria-label="Account actions">
            <button type="button" class="tab-button active" id="registerTab" role="tab" aria-selected="true">Register</button>
            <button type="button" class="tab-button" id="loginTab" role="tab" aria-selected="false">Login</button>
        </div>

        <section id="registerPanel">
            <h1>Create your student account</h1>

            <form id="studentForm">

            <label>Full Name</label>
            <input type="text" id="name" required>

            <label>Email</label>
            <input type="email" id="email" required>

                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" required>

                <label for="password">Password</label>
                <input type="password" id="password" minlength="6" required>

                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" minlength="6" required>

            <label>Date of Birth</label>
            <input type="date" id="dob" required>

            <label>Course</label>
            <select id="course" required>
                <option value="">Select Course</option>
                <option value="B.Tech">B.Tech</option>
                <option value="BCA">BCA</option>
                <option value="B.Sc">B.Sc</option>
                <option value="MCA">MCA</option>
            </select>

            <label>Address</label>
            <textarea id="address" required></textarea>

                <button type="submit">Create account</button>

            </form>
        </section>

        <section id="loginPanel" hidden>
            <h1>Welcome back</h1>

            <form id="loginForm">
                <label for="loginEmail">Email</label>
                <input type="email" id="loginEmail" autocomplete="email" required>

                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" autocomplete="current-password" required>

                <button type="submit">Login</button>
            </form>
        </section>

        <p id="message"></p>

    </div>

    <script src="script.js"></script>

</body>
</html>
